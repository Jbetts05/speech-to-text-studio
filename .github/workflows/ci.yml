name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AI_BENCH_ALLOW_NETWORKED_SOLUTIONS: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npx playwright install --with-deps chromium

      - name: Lint and type check
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy

      - name: Test Python
        run: python -m pytest

      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm test
          npm run typecheck
          npm run build
          npm run test:e2e

      - name: Verify committed frontend assets
        run: git diff --exit-code -- src/ai_bench/web/static

      - name: Build Python package
        run: |
          python -m build
          python scripts/check_wheel.py

      - name: Compile Bicep
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout >/dev/null

      - name: Validate deployment package
        run: python -m infra.scripts.stage_package --dry-run

      - name: Validate documentation and repository hygiene
        run: |
          python scripts/check_docs.py
          python scripts/check_repository_hygiene.py
